<!-- ==========================================================================
     PDM Kiosk Portal - Login Form Component (Student C: The Architect)
     Task: Build the student credentials card with Student ID and Password inputs.
     ========================================================================== -->

<div class="credentials-card">
  <div class="form-group">
    <label for="student-id">Student ID Number</label>
    <input type="text" id="student-id" placeholder="2024-01048" autocomplete="off" required>
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••••••" required>
  </div>

  <!-- Interactive 3D Log In Button (Activated by Student D) -->
  <button type="button" id="login-btn" class="login-btn">
    <span>Access Portal</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14"></path>
      <path d="m12 5 7 7-7 7"></path>
    </svg>
  </button>

  <div id="login-alert" class="alert-box"></div>
</div>
